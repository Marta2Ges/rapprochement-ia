# Lance automatiquement les tests à chaque modification du dépôt (GitHub Actions).
name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    # Version d'Ubuntu fixée pour éviter qu'un changement de "ubuntu-latest" modifie l'environnement.
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lancer les tests unitaires
        run: python -m unittest -v

      - name: Lancer l'outil sur les données d'exemple
        run: python -m recon --bank data/bank_statement.csv --ledger data/ledger.csv --out output
